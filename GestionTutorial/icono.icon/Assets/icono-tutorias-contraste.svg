      .fig { fill: none; stroke: #64748B; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .fill1 { fill: #FFFFFF; }
      .fill2 { fill: #FFFFFF; opacity: 0.6; }
      .accent { fill: #475569; }
    </style>
  </defs>

  <!-- figura tutor (más alta, izquierda) -->
